
<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Element selector */
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
            color: green;
        }

        /* ID selector */
        #heading {
            background-color: yellow;
            padding: 10px;
        }

        /* Class selector */
        .red {
            color: red;
        }

        .center {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1 id="heading">CSS Selectors</h1>

    <p>This is an example of an element selector.</p>

    <p class="red">This paragraph uses a class selector.</p>

    <p class="center">This paragraph is center aligned.</p>

</body>
</html>
